<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

    <!-- Default title/meta for planner (bare /) — analytics pages set their own via JS -->
    <title>DeFi Garden 🌱 | Plan Your DeFi Savings by Goal</title>
    <meta name="description" content="A goal-first DeFi savings planner. Tell us what you're saving for and how much you can set aside each month — we'll show what live, real pool rates could grow it into. Every number is live DefiLlama data. Education, not advice.">

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="DeFi savings planner, goal-based saving, stablecoin yield, retirement DeFi, compound growth, yield farming, cryptocurrency, APY, DeFi Garden">
    <meta name="author" content="DeFi Garden">
    <meta name="robots" content="index, follow">
    <!-- No static canonical here (spec 011) — the IA router below is the
         single source of truth for BOTH canonical and og:url, in every mode,
         on every load. See canonical.js / window.__canonicalFor. -->

    <!-- Multilingual SEO -->
    <link rel="alternate" hreflang="en" href="https://www.defi.garden/">
    <link rel="alternate" hreflang="ko" href="https://www.defi.garden/?lang=ko">

    <meta name="twitter:title" content="DeFi Garden 🌱 | Plan Your DeFi Savings by Goal">
    <meta name="twitter:description" content="Tell us what you're saving for. We'll show what live, real DeFi pool rates could grow your monthly deposits into.">
    <meta name="twitter:image" content="https://www.defi.garden/og-image.png">
    <meta name="twitter:creator" content="@defigarden">

    <!-- App Icons and Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌱</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌱</text></svg>">

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#2D5A3D">
    <meta name="msapplication-TileColor" content="#2D5A3D">

    <!-- Performance: Preload critical resources -->
    <link rel="preload" href="./fonts/FKGroteskNeue.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="dns-prefetch" href="//unpkg.com">
    <link rel="dns-prefetch" href="//yields.llama.fi">

    <!-- Canonical-URL pure function (spec 011) — loaded synchronously, BEFORE
         the router below, which calls window.__canonicalFor(). No defer: the
         router runs synchronously immediately after this tag and needs the
         global ready before it executes. -->
    <script src="canonical.js"></script>

    <script>
        // IA Router — runs before React loads. Zero flash. Zero double-load.
        // ANALYTICS PARAMS: any of these mean "show the analytics app"
        // PLANNER PARAMS:   goal/monthly/years/pace/preset/fresh = planner
        // Bare /            = planner (new default per spec §7)
        (function () {
            var params = new URLSearchParams(window.location.search);
            var ANALYTICS_PARAMS = ['token', 'chain', 'pool', 'poolTypes', 'protocols', 'minTvl', 'minApy', 'app'];
            var needsAnalytics = ANALYTICS_PARAMS.some(function(k) { return params.has(k); });
            window.__APP_MODE = needsAnalytics ? 'analytics' : 'planner';

            // Apply saved theme before paint to avoid flash
            window.process = { env: {} };
            try {
                var saved = localStorage.getItem('theme');
                var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            } catch (e) {}

            // Canonical/og:url — ALWAYS set from JS in both modes (spec 011:
            // no static canonical exists anymore, so this is the single source
            // of truth; a missing pre-render canonical is neutral, a wrong one
            // is actively harmful). Analytics mode self-canonicalizes on the
            // normalized query; planner mode (incl. share URLs) canonicalizes
            // to root. See canonical.js for the normalization rules.
            var canonicalUrl = window.__canonicalFor(window.location.search);
            var canon = document.querySelector('link[rel="canonical"]');
            if (!canon) {
                canon = document.createElement('link');
                canon.rel = 'canonical';
                document.head.appendChild(canon);
            }
            canon.href = canonicalUrl;
            var ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.content = canonicalUrl;

            // Title/description rewrite — analytics mode only; the static
            // defaults already in <head> are the correct planner-mode values.
            if (needsAnalytics) {
                document.title = 'DeFi Garden 🌱 | Discover Highest Yield Farming Opportunities Across All Chains';
                var desc = document.querySelector('meta[name="description"]');
                if (desc) desc.content = 'Find the best DeFi yields for your tokens with DeFi Garden. Compare lending, staking, and LP rewards across 50+ protocols and all major chains. Real-time APY data from Defillama API.';
                var ogTitle = document.querySelector('meta[property="og:title"]');
                if (ogTitle) ogTitle.content = document.title;
            }
        })();
    </script>

    <!-- Shared CSS (always loaded) -->
    <link rel="stylesheet" href="style.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="style.css"></noscript>

    <!-- Mode-conditional CSS: injected synchronously so it fetches in parallel -->
    <script>
        (function() {
            var mode = window.__APP_MODE;
            var head = document.head;
            function addCSS(href) {
                var l = document.createElement('link');
                l.rel = 'stylesheet'; l.href = href;
                l.media = 'print'; l.onload = function() { this.media = 'all'; };
                head.appendChild(l);
            }
            if (mode === 'analytics') { addCSS('pool-detail-styles.css'); }
            else { addCSS('planner-styles.css'); }
        })();
    </script>

    <!-- React UMD (shared, static defer — guaranteed order after HTML parse) -->
    <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script defer src="translations.js"></script>

    <!-- Mixpanel — synchronous stub loader (queues calls until the real lib loads
         async); safe to run before analytics.js since it just needs `mixpanel`
         to exist as a callable stub, not fully loaded.
         Served first-party via mp.defi.garden (Cloudflare Worker proxying
         cdn.mxpnl.com + api.mixpanel.com, added 2026-07-09) instead of Mixpanel's
         own domains — see workers/mixpanel-proxy/. -->
    <script type="text/javascript">
        window.MIXPANEL_CUSTOM_LIB_URL = "https://mp.defi.garden/lib.min.js";
        (function (f, b) { if (!b.__SV) { var e, g, i, h; window.mixpanel = b; b._i = []; b.init = function (e, f, c) { function g(a, d) { var b = d.split("."); 2 == b.length && ((a = a[b[0]]), (d = b[1])); a[d] = function () { a.push([d].concat(Array.prototype.slice.call(arguments, 0))); }; } var a = b; "undefined" !== typeof c ? (a = b[c] = []) : (c = "mixpanel"); a.people = a.people || []; a.toString = function (a) { var d = "mixpanel"; "mixpanel" !== c && (d += "." + c); a || (d += " (stub)"); return d; }; a.people.toString = function () { return a.toString(1) + ".people (stub)"; }; i = "disable time_event track track_pageview track_links track_forms track_with_groups add_group set_group remove_group register register_once alias unregister identify name_tag set_config reset opt_in_tracking opt_out_tracking has_opted_in_tracking has_opted_out_tracking clear_opt_in_out_tracking start_batch_senders people.set people.set_once people.unset people.increment people.append people.union people.track_charge people.clear_charges people.delete_user people.remove".split(" "); for (h = 0; h < i.length; h++) g(a, i[h]); var j = "set set_once union unset remove delete".split(" "); a.get_group = function () { function b(c) { d[c] = function () { call2_args = arguments; call2 = [c].concat(Array.prototype.slice.call(call2_args, 0)); a.push([e, call2]); }; } for (var d = {}, e = ["get_group"].concat(Array.prototype.slice.call(arguments, 0)), c = 0; c < j.length; c++) b(j[c]); return d; }; b._i.push([e, f, c]); }; b.__SV = 1.2; e = f.createElement("script"); e.type = "text/javascript"; e.async = !0; e.src = "undefined" !== typeof MIXPANEL_CUSTOM_LIB_URL ? MIXPANEL_CUSTOM_LIB_URL : "file:" === f.location.protocol && "//cdn.mxpnl.com/libs/mixpanel-2-latest.min.js".match(/^\/\//) ? "https://cdn.mxpnl.com/libs/mixpanel-2-latest.min.js" : "//cdn.mxpnl.com/libs/mixpanel-2-latest.min.js"; g = f.getElementsByTagName("script")[0]; g.parentNode.insertBefore(e, g); } })(document, window.mixpan         mixpanel.init("f22917d9da245858a6789c9e5d412c36", { debug: false, track_pageview: false, persistence: "localStorage", api_host: "https://mp.defi.garden" });
    </script>

    <!-- Analytics — plain JS, used by BOTH planner and analytics app; static defer
         so it's guaranteed to exist before planner.js's first tracking call fires
         (the old dynamic-injection-into-body path raced planner.js's mount). -->
    <script defer src="analytics.js"></script>

    <!-- Planner script — static defer so it runs after React + translations + analytics -->
    <script defer src="planner.js"></script>

    <!-- WebMCP implementation for AI Agents -->
    <script>
        (function() {
            window.navigator = window.navigator || {};
            if (!window.navigator.modelContext) {
                window.navigator.modelContext = {
                    tools: [],
                    provideContext: function(options) {
                        if (options && options.tools) {
                            this.tools.push.apply(this.tools, options.tools);
                        }
                        return Promise.resolve();
                    }
                };
            }
            window.navigator.modelContext.provideContext({
                tools: [
                    {
                        name: "search_yield_pools",
                        description: "Search and filter live DeFi yield pools. Fetches live data from DefiLlama API with trust-rail filters (minimum $10M TVL).",
                        inputSchema: {
                            type: "object",
                            properties: {
                                token: { type: "string", description: "Filter by token symbol, e.g. USDC, ETH" },
                                chain: { type: "string", description: "Filter by blockchain, e.g. Ethereum, Base, Arbitrum" },
                                minApy: { type: "number", description: "Minimum APY percentage, e.g. 5" }
                            }
                        },
                        execute: function(args) {
                            return fetch("https://yields.llama.fi/pools")
                                .then(function(res) { return res.json(); })
                                .then(function(json) {
                                    var pools = json.data || [];
                                    var token = (args.token || "").toLowerCase();
                                    var chain = (args.chain || "").toLowerCase();
                                    var minApy = args.minApy || 0;
                                    
                                    var filtered = pools.filter(function(p) {
                                        if (p.tvlUsd < 10000000) return false;
                                        if (p.apy > 1000) return false;
                                        
                                        if (token && !p.symbol.toLowerCase().includes(token)) return false;
                                        if (chain && p.chain.toLowerCase() !== chain) return false;
                                        if (minApy && p.apy < minApy) return false;
                                        return true;
                                    });
                                    
                                    return {
                                        success: true,
                                        results: filtered.slice(0, 10).map(function(p) {
                                            return {
                                                pool: p.pool,
                                                project: p.project,
                                                symbol: p.symbol,
                                                chain: p.chain,
                                                tvlUsd: p.tvlUsd,
                                                apy: p.apy
                                            };
                                        })
                                    };
                                })
                                .catch(function(err) {
                                    return { success: false, error: err.message };
                                });
                        }
                    },
                    {
                        name: "calculate_savings_projection",
                        description: "Calculate goal-first savings projection and yield-funded milestones using compound interest math.",
                        inputSchema: {
                            type: "object",
                            required: ["monthlyDeposit", "years"],
                            properties: {
                                monthlyDeposit: { type: "number", description: "Monthly savings amount in USD" },
                                years: { type: "number", description: "Investment horizon in years, max 10" },
                                goalName: { type: "string", description: "The name of the goal, e.g. Retirement, Rent" }
                            }
                        },
                        execute: function(args) {
                            var monthly = args.monthlyDeposit;
                            var years = args.years;
                            var months = years * 12;
                            var apy = 5.5;
                            var rate = apy / 100 / 12;
                            
                            var totalDeposited = monthly * months;
                            var futureValue = 0;
                            if (rate === 0) {
                                futureValue = totalDeposited;
                            } else {
                                futureValue = monthly * ((Math.pow(1 + rate, months) - 1) / rate) * (1 + rate);
                            }
                            
                            var interestEarned = futureValue - totalDeposited;
                            
                            return Promise.resolve({
                                success: true,
                                projection: {
                                    goalName: args.goalName || "Savings",
                                    monthlyDeposit: monthly,
                                    years: years,
                                    estimatedApy: apy,
                                    totalDeposited: Math.round(totalDeposited),
                                    estimatedFutureValue: Math.round(futureValue),
                                    interestEarned: Math.round(interestEarned)
                                }
                            });
                        }
                    }
                ]
            });
        })();
    </script>
</head>
<body>
    <!-- Root mounts for both experiences; only one gets populated per load -->
    <div id="root"></div>
    <div id="planner-root"></div>

    <!-- Analytics-app scripts (PoolDetail/app.js) — injected only when needed
         (Babel requires dynamic load). analytics.js itself is now a static
         defer tag in <head>, shared by both modes — see above. -->
    <script>
        if (window.__APP_MODE === 'analytics') {
            (function() {
                function addScript(src, type, onload) {
                    var s = document.createElement('script');
                    s.src = src;
                    if (type) s.setAttribute('type', type);
                    if (onload) s.onload = onload;
                    document.body.appendChild(s);
                }
                addScript('search-parser.js'); // plain script, must be ready before app.js is transpiled
                addScript('PoolDetail.js', 'text/babel');
                addScript('app.js', 'text/babel');
                // Babel is injected async, so it loads AFTER DOMContentLoaded has fired —
                // its auto-scan never runs. Transpile the injected text/babel scripts
                // explicitly once Babel is ready, so the analytics app actually mounts.
                addScript('https://unpkg.com/@babel/standalone/babel.min.js', null, function() {
                    if (window.Babel && Babel.transformScriptTags) Babel.transformScriptTags();
                });
            })();
        }
    </script>
</body>
</html>
