<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYPE Funding Harvest | DeFi Garden</title>
    <meta name="description" content="Delta-Neutral Cash & Carry funding harvest for HYPE on Hyperliquid. Calculate annualized carry and live funding rates with trust rails.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="hype-harvest.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="trust-rails.js"></script>
    <script src="translations.js"></script>
    <script src="hype-harvest.js"></script>
</head>
<body>
    <header class="app-header" style="max-width: 960px; margin: 1rem auto 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center;">
        <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem; color: inherit;">
            <span style="font-size: 1.5rem;">🌱</span>
            <span style="font-weight: 700; font-size: 1.2rem;">DeFi Garden</span>
        </a>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <button id="theme-toggle" class="neuro-chip" onclick="toggleTheme()" style="padding: 0.35rem 0.7rem;">🌓 Theme</button>
            <button id="lang-toggle" class="neuro-chip" onclick="toggleLang()" style="padding: 0.35rem 0.7rem;">🌐 EN/KO</button>
        </div>
    </header>

    <main id="hype-harvest-root"></main>

    <script>
        var currentLang = (typeof detectUserLanguage === 'function') ? detectUserLanguage() : 'en';
        
        function applyTheme() {
            var saved = localStorage.getItem('theme');
            var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        }

        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'ko' : 'en';
            renderApp();
        }

        function renderApp() {
            var root = ReactDOM.createRoot(document.getElementById('hype-harvest-root'));
            root.render(React.createElement(window.HypeFundingHarvest, { lang: currentLang }));
        }

        applyTheme();
        renderApp();
    </script>
</body>
</html>
