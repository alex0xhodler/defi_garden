name: 'Build & Publish Site'

on:
  schedule:
    # Run daily at 2 AM UTC to update sitemap with fresh content
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering
  push:
    # Vercel serves alex0xhodler/defi_garden-site, not this repo, so EVERY change
    # to main has to go through this build to reach production.
    branches: [ main ]

# Serialize the daily cron and push-triggered runs so their checkouts/pushes
# can't interleave (the live 04:32/04:50 collision window — 081). Never cancel an
# in-flight run: a half-finished sitemap push is worse than waiting.
concurrency:
  group: sitemap-update
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore last published build (generated outputs are not in this repo)
      # Generators read their own previous output: sitemap lastmod preservation,
      # the pool-pages manifest that drives vercel.json 301s, stale-page cleanup,
      # stocks/landing fallbacks. Restoring the published build keeps all of that
      # byte-identical to when these files were committed here.
      env:
        SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
      run: |
        mkdir -p ~/.ssh && echo "$SITE_DEPLOY_KEY" > ~/.ssh/site_deploy && chmod 600 ~/.ssh/site_deploy
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
        git clone --quiet --depth 1 git@github.com:alex0xhodler/defi_garden-site.git "$RUNNER_TEMP/site"
        scripts/restore-site-outputs.sh "$RUNNER_TEMP/site"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: package.json
    
    - name: Install dependencies
      run: npm install --only=production

    - name: DefiLlama canary (free /pools + /chart still up, 200, same shape)
      # Fail-fast on purpose, placed right after install and BEFORE any
      # generator: every later step bakes pages/sitemaps/forecasts from this
      # feed and the job then commits them to main, so a degraded or
      # reshaped feed must stop the run before garbage is published (the
      # next daily cron simply retries). The script itself retries 5xx/network
      # blips 3x, so a single hiccup does not page anyone. See
      # docs/defillama-api.md for what to do when this goes red.
      run: node scripts/llama-canary.js

    - name: Compile app.js / PoolDetail.js (backlog 052 — drop in-browser Babel)
      run: |
        echo "🛠️ Compiling analytics app scripts..."
        node compile-app.js
        echo "✅ Compile completed"

    - name: Minify JS/CSS (backlog 053 — cut transfer size)
      run: |
        echo "🗜️ Minifying shipped JS/CSS..."
        node minify-assets.js
        echo "✅ Minify completed"

    - name: Generate pools snapshot (backlog 059 — static trust-rail-filtered data layer)
      run: |
        echo "📸 Generating static pools snapshot + per-chain/token slices..."
        node generate-pools-snapshot.js --seo-out "$RUNNER_TEMP/seo-pools.json"
        echo "✅ Pools snapshot generation completed"

    - name: Generate protocol URLs (backlog 182 — CI-baked north-star CTA URL map)
      run: |
        echo "🔗 Generating baked protocol-URL map..."
        node generate-protocol-urls.js
        echo "✅ Protocol URL generation completed"

    - name: Compute KPIs + retain history (backlog 087 — data-layer leg 2 phase 0; 110 — read from D1 when provisioned)
      # D1 /history read PAUSED (2026-10-21). It reads ~1.64M rows per call (90 days
      # of hourly rows) and then 503s (a single JSON response blows the free Worker
      # 10 ms CPU / 128 MB limits), so every run paid ~1/3 of the 5M/day D1 read
      # limit and still fell back to data/history/*.json. Without HISTORY_ENDPOINT,
      # compute-kpis.js takes that file path directly: identical KPIs, ~0 D1 reads.
      # Re-enabled by the paginated /samples + R2 archive path (history v2).
      run: |
        echo "📈 Appending slim history point + computing per-pool KPIs..."
        node compute-kpis.js
        echo "✅ KPI computation completed"

    - name: Compute TimesFM forecasts + DeFi Score (estate-wide)
      env:
        ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
      run: |
        echo "🧠 Running TimesFM 3.0 estate-wide forecasts + on-chain scoring..."
        curl -LsSf https://astral.sh/uv/install.sh | sh
        $HOME/.local/bin/uv run --with "timesfm[torch]" --with web3 python3 compute-forecasts.py --limit 0
        echo "✅ TimesFM forecasts & DeFi scores completed"

    - name: Record point-in-time daily forecast ledger (P0-2)
      run: |
        echo "📝 Recording point-in-time daily forecast ledger..."
        node scripts/record-daily-forecast.js

    - name: Generate landing hero data (curated pools + DeFi Score)
      run: |
        node generate-landing-pools.js
        node generate-pool-scores-json.js

    - name: Generate /stocks terminal data (curated equity registry x pools snapshot)
      # Needs snapshot + forecasts + DeFi Score above. Non-fatal: a registry/data
      # problem turns this step red but must not block the daily sitemap run; the
      # previously committed data/stocks-snapshot.json stays in place. The same
      # script also writes the slim client payload data/stocks-pools.json that
      # /stocks fetches. Both are committed by the `git add ... data ...` step below.
      continue-on-error: true
      run: |
        node generate-stocks-snapshot.js

    - name: Generate scored pool pages (W1 — static /pools/<slug> pages, manifest + sitemaps)
      # Must run BEFORE token/chain pages: they read data/pool-pages.json to
      # repoint pool rows at /pools/<slug>. Needs snapshot + forecasts above.
      run: |
        echo "📊 Generating static scored /pools/ pages..."
        node generate-pool-score-pages.js --out pools --limit 100
        echo "Pages: $(ls pools/*.html | wc -l) · sitemap URLs: $(grep -c '<loc>' sitemap-pool-pages.xml)"

    - name: Generate token landing pages
      run: |
        echo "🌿 Generating static /tokens/ landing pages + sitemap..."
        node generate-token-pages.js --out tokens --sitemap sitemap-token-pages.xml --fixture "$RUNNER_TEMP/seo-pools.json"
        echo "Pages: $(ls tokens | wc -l) · sitemap URLs: $(grep -c '<loc>' sitemap-token-pages.xml)"

    - name: Generate chain landing pages
      run: |
        echo "⛓️ Generating static /chains/ landing pages + sitemap..."
        node generate-chain-pages.js --out chains --sitemap sitemap-chain-pages.xml --fixture "$RUNNER_TEMP/seo-pools.json"
        echo "Pages: $(ls chains | wc -l) · sitemap URLs: $(grep -c '<loc>' sitemap-chain-pages.xml)"

    - name: Generate pool markdown twins (backlog 213 — agent-readable pool-detail surface)
      run: |
        echo "🌱 Generating static /pools/ markdown twins..."
        node generate-pool-pages.js --out pools --fixture "$RUNNER_TEMP/seo-pools.json"
        echo "Pages: $(ls pools | wc -l)"

    - name: Generate public forecast accuracy scorecard (W2 / P0-2)
      run: |
        echo "📊 Evaluating empirical forecast accuracy scorecard against naive baseline..."
        node scripts/evaluate-forecast-accuracy.js

    - name: Generate sitemap
      run: |
        echo "🚀 Generating fresh sitemap..."
        POOLS_FIXTURE="$RUNNER_TEMP/seo-pools.json" node generate-sitemap.js
        
        echo "📊 Sitemap stats:"
        echo "File size: $(du -h sitemap.xml | cut -f1)"
        echo "URL count: $(grep -c '<url>' sitemap.xml)"
        
        echo "✅ Sitemap generation completed"
    
    - name: Generate LLM files
      run: |
        echo "🤖 Generating LLM-friendly files..."
        POOLS_FIXTURE="$RUNNER_TEMP/seo-pools.json" node generate-llms.js
        
        echo "📊 LLM files stats:"
        if [ -f llms.txt ]; then
          echo "llms.txt size: $(du -h llms.txt | cut -f1)"
        fi
        if [ -f llms-full.txt ]; then
          echo "llms-full.txt size: $(du -h llms-full.txt | cut -f1)"
        fi
        
        echo "✅ LLM files generation completed"
    
    - name: Validate sitemap XML
      run: |
        echo "🔍 Validating every generated sitemap*.xml..."
        # Node-based (fast-xml-parser, already a dependency) instead of xmllint,
        # which isn't installed on the runner — the old step could never
        # actually validate and silently passed on any input. This one fails
        # the job if any generated sitemap is malformed, so a broken sitemap is
        # never committed or published.
        node validate-sitemaps.js
    
    - name: Commit records + config to main (small files only)
      # Only state that must be durable and reviewable lives in this repo:
      # the KPI history window, the point-in-time forecast ledger, vercel.json
      # (generator-owned 301s for dropped pool pages), robots.txt and the
      # compiled/minified bundles. Everything else is published to the site repo.
      run: |
        git config --local user.email "alex@0xhodler.nl"
        git config --local user.name "alex0xhodler"
        git add -A -- data/history data/forecasts vercel.json robots.txt \
          app.compiled.js PoolDetail.compiled.js app.compiled.min.js PoolDetail.compiled.min.js \
          planner.min.js translations.min.js style.min.css planner-styles.min.css pool-detail-styles.min.css
        if git diff --cached --quiet; then
          echo "✅ No record changes"
          exit 0
        fi
        git commit -q -m "chore: record daily KPI history + forecast ledger

        🤖 Automated update via GitHub Actions"
        # Same race handling as before: rebase our record commit onto latest main.
        for attempt in 1 2 3 4 5; do
          if git push origin HEAD:main; then echo "✅ Records pushed"; exit 0; fi
          echo "⚠️ Push rejected (attempt $attempt) — rebasing onto latest main..."
          git pull --rebase --autostash -X theirs origin main || { git rebase --abort || true; exit 1; }
          sleep $((attempt * 3))
        done
        echo "❌ Could not push records after 5 attempts"; exit 1

    - name: Assemble site tree
      # Site = every file tracked on main + the generated outputs. Built in a clean
      # directory so runner junk (node_modules, caches) can never be published.
      run: |
        OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
        git ls-files -z -- . ':!.github' | rsync -a --from0 --ignore-missing-args --files-from=- ./ "$OUT/"
        shopt -s nullglob
        grep -vE '^\s*(#|$)' scripts/site-outputs.txt | while read -r pattern; do
          for p in $pattern; do mkdir -p "$OUT/$(dirname "$p")"; rsync -a "$p" "$OUT/$(dirname "$p")/"; done
        done
        mv "$RUNNER_TEMP/site/.git" "$OUT/.git"
        cd "$OUT"
        # --force: the tree carries main's .gitignore, which ignores every generated
        # output; without it the site commit would silently drop all of them.
        git add -A --force
        git -c user.email=alex@0xhodler.nl -c user.name=alex0xhodler commit -q --allow-empty \
          -m "site build $(date -u +%FT%TZ) from defi_garden@${GITHUB_SHA::8}"
        echo "Files: $(git ls-files | wc -l) · changed vs live: $(git diff --name-only HEAD~1 | wc -l)"

    - name: Gate — deployable file set + link integrity
      # Runs against the exact tree Vercel will serve. A red gate means nothing ships.
      run: node "$RUNNER_TEMP/out/test_vercelignore.js"

    - name: Publish to site repo (Vercel production deploys from it)
      # Force-push a single parentless commit: the site repo never accumulates
      # history, so it cannot grow the way this repo did.
      run: |
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
        cd "$RUNNER_TEMP/out"
        if git diff --quiet HEAD~1 HEAD; then echo "✅ Site unchanged — nothing to publish"; echo "PUBLISHED=0" >> $GITHUB_ENV; exit 0; fi
        ORPHAN=$(git -c user.email=alex@0xhodler.nl -c user.name=alex0xhodler commit-tree "HEAD^{tree}" -m "$(git log -1 --format=%s)")
        git push --force origin "$ORPHAN:refs/heads/main"
        echo "PUBLISHED=1" >> $GITHUB_ENV
        echo "✅ Published $ORPHAN"

    - name: Wait for production to serve this build
      if: env.PUBLISHED == '1'
      run: |
        want=$(jq -r .generatedAt data/pools-snapshot-meta.json)
        for i in $(seq 1 40); do
          live=$(curl -fsS "https://www.defi.garden/data/pools-snapshot-meta.json?cb=$RANDOM" | jq -r .generatedAt || true)
          if [ "$live" = "$want" ]; then echo "✅ Live (generatedAt=$live)"; exit 0; fi
          echo "waiting for deploy ($i/40): live=$live want=$want"; sleep 15
        done
        echo "❌ Production did not pick up this build within 10 min"; exit 1

    - name: Post-deploy MCP smoke (Production)
      if: env.PUBLISHED == '1'
      env:
        SMOKE_ALLOW_PROTECTED: '0'
      run: |
        for attempt in 1 2 3; do
          if node test_mcp_post_deploy_smoke.js "https://www.defi.garden"; then exit 0; fi
          echo "attempt $attempt failed; retrying"; sleep 30
        done
        exit 1

    # NOTE: The old Google and Bing sitemap-ping HTTP endpoints were deprecated
    # in 2023/2022 and now return 404/410 — they no longer accept sitemap
    # notifications. Both point site owners to IndexNow, which the next step
    # already does (verified HTTP 200). The dead "Ping Google" step was removed
    # (item 141) because it printed "Search engines notified" while doing
    # nothing — a misleading green in the CI log.

    - name: Ping IndexNow
      # Now runs only once the new build is actually live (it used to fire before
      # Vercel had finished deploying the pushed commit).
      if: env.PUBLISHED == '1'
      run: |
        echo "⚡ Submitting changed URLs to IndexNow (Bing + Yandex)..."
        node indexnow-ping.js || echo "IndexNow submission failed"

    - name: Summary
      run: |
        echo "## Sitemap & LLM Files Update Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Total URLs**: $(grep -c '<url>' sitemap.xml)" >> $GITHUB_STEP_SUMMARY
        echo "- **Sitemap Size**: $(du -h sitemap.xml | cut -f1)" >> $GITHUB_STEP_SUMMARY
        if [ -f llms.txt ]; then
          echo "- **LLM Files**: llms.txt ($(du -h llms.txt | cut -f1)), llms-full.txt ($(du -h llms-full.txt | cut -f1))" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- **Last Updated**: $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Completed successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### SEO & AI Benefits" >> $GITHUB_STEP_SUMMARY
        echo "- Individual token yield pages for organic search" >> $GITHUB_STEP_SUMMARY
        echo "- Network-specific landing pages" >> $GITHUB_STEP_SUMMARY
        echo "- Pool type categorization pages" >> $GITHUB_STEP_SUMMARY
        echo "- High-value TVL and APY filter pages" >> $GITHUB_STEP_SUMMARY
        echo "- AI-friendly content discovery via llms.txt" >> $GITHUB_STEP_SUMMARY
        echo "- Enhanced robots.txt with AI crawler permissions" >> $GITHUB_STEP_SUMMARY
        echo "- Daily update frequency for fresh content" >> $GITHUB_STEP_SUMMARY
