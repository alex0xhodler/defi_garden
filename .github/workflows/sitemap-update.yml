name: 'Update Sitemap'

on:
  schedule:
    # Run daily at 2 AM UTC to update sitemap with fresh content
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [ main ]
    paths:
      - 'generate-sitemap.js'
      - 'generate-pools-snapshot.js'
      - 'compute-kpis.js'
      - 'generate-token-pages.js'
      - 'generate-chain-pages.js'
      - 'compile-app.js'
      - 'minify-assets.js'
      - 'app.js'
      - 'PoolDetail.js'
      - 'planner.js'
      - 'translations.js'
      - 'style.css'
      - 'planner-styles.css'
      - 'pool-detail-styles.css'
      - 'package.json'

# Serialize the daily cron and push-triggered runs so their checkouts/pushes
# can't interleave (the live 04:32/04:50 collision window — 081). Never cancel an
# in-flight run: a half-finished sitemap push is worse than waiting.
concurrency:
  group: sitemap-update
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: package.json
    
    - name: Install dependencies
      run: npm install --only=production

    - name: Compile app.js / PoolDetail.js (backlog 052 — drop in-browser Babel)
      run: |
        echo "🛠️ Compiling analytics app scripts..."
        node compile-app.js
        echo "✅ Compile completed"

    - name: Minify JS/CSS (backlog 053 — cut transfer size)
      run: |
        echo "🗜️ Minifying shipped JS/CSS..."
        node minify-assets.js
        echo "✅ Minify completed"

    - name: Generate pools snapshot (backlog 059 — static trust-rail-filtered data layer)
      run: |
        echo "📸 Generating static pools snapshot + per-chain/token slices..."
        node generate-pools-snapshot.js --seo-out "$RUNNER_TEMP/seo-pools.json"
        echo "✅ Pools snapshot generation completed"

    - name: Compute KPIs + retain history (backlog 087 — data-layer leg 2 phase 0)
      run: |
        echo "📈 Appending slim history point + computing per-pool KPIs..."
        node compute-kpis.js
        echo "✅ KPI computation completed"

    - name: Generate token landing pages
      run: |
        echo "🌿 Generating static /tokens/ landing pages + sitemap..."
        node generate-token-pages.js --out tokens --sitemap sitemap-token-pages.xml --fixture "$RUNNER_TEMP/seo-pools.json"
        echo "Pages: $(ls tokens | wc -l) · sitemap URLs: $(grep -c '<loc>' sitemap-token-pages.xml)"

    - name: Generate chain landing pages
      run: |
        echo "⛓️ Generating static /chains/ landing pages + sitemap..."
        node generate-chain-pages.js --out chains --sitemap sitemap-chain-pages.xml --fixture "$RUNNER_TEMP/seo-pools.json"
        echo "Pages: $(ls chains | wc -l) · sitemap URLs: $(grep -c '<loc>' sitemap-chain-pages.xml)"

    - name: Generate sitemap
      run: |
        echo "🚀 Generating fresh sitemap..."
        POOLS_FIXTURE="$RUNNER_TEMP/seo-pools.json" node generate-sitemap.js
        
        echo "📊 Sitemap stats:"
        echo "File size: $(du -h sitemap.xml | cut -f1)"
        echo "URL count: $(grep -c '<url>' sitemap.xml)"
        
        echo "✅ Sitemap generation completed"
    
    - name: Generate LLM files
      run: |
        echo "🤖 Generating LLM-friendly files..."
        node generate-llms.js
        
        echo "📊 LLM files stats:"
        if [ -f llms.txt ]; then
          echo "llms.txt size: $(du -h llms.txt | cut -f1)"
        fi
        if [ -f llms-full.txt ]; then
          echo "llms-full.txt size: $(du -h llms-full.txt | cut -f1)"
        fi
        
        echo "✅ LLM files generation completed"
    
    - name: Validate sitemap XML
      run: |
        echo "🔍 Validating every generated sitemap*.xml..."
        # Node-based (fast-xml-parser, already a dependency) instead of xmllint,
        # which isn't installed on the runner — the old step could never
        # actually validate and silently passed on any input. This one fails
        # the job if any generated sitemap is malformed, so a broken sitemap is
        # never committed or published.
        node validate-sitemaps.js
    
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "📝 Changes detected in sitemap files"
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "✅ No changes in sitemap files"
        fi
    
    - name: Commit updated files
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "alex@0xhodler.nl"
        git config --local user.name "alex0xhodler"
        
        git add data sitemap.xml sitemap-token-pages.xml tokens sitemap-chain-pages.xml chains sitemap-token-pages-ko.xml sitemap-chain-pages-ko.xml ko robots.txt llms.txt llms-full.txt og app.compiled.js PoolDetail.compiled.js app.compiled.min.js PoolDetail.compiled.min.js planner.min.js translations.min.js style.min.css planner-styles.min.css pool-detail-styles.min.css
        git add -A -- 'sitemap*.xml'
        git commit -m "chore: update sitemap and LLM files with latest yields
        
        - Regenerated sitemap index with $( { grep -o '<sitemap>' sitemap.xml || true; } | wc -l ) child sitemaps and $( { grep -o '<url>' sitemap*.xml || true; } | wc -l ) total URLs
        - Updated robots.txt with AI crawler support
        - Generated llms.txt and llms-full.txt for AI assistants
        - Includes latest DeFi tokens and yield opportunities
        
        🤖 Automated update via GitHub Actions"
        
        echo "✅ Changes committed"
    
    - name: Push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        # This job races with any other push to main (a merged PR, a concurrent
        # run). A plain `git push` fails the whole workflow on rejection — the
        # actual cause of the red builds. Rebase our regenerated-artifact commit
        # onto the latest main and retry with backoff instead. The committed
        # files are all regenerated output, so rebasing them forward is safe.
        for attempt in 1 2 3 4 5; do
          if git push origin main; then
            echo "✅ Changes pushed to repository"
            exit 0
          fi
          echo "⚠️ Push rejected (attempt $attempt) — rebasing onto latest main..."
          # -X theirs: the committed files are all freshly regenerated output,
          # so on a conflict with main (another regen / merged PR) OUR version
          # is the current one — take it wholesale instead of failing. ("theirs"
          # during a rebase = the commit being replayed, i.e. this run's files.)
          git pull --rebase --autostash -X theirs origin main || {
            echo "❌ Rebase failed unexpectedly — aborting"; git rebase --abort || true; exit 1;
          }
          sleep $((attempt * 3))
        done
        echo "❌ Could not push after 5 attempts"
        exit 1
    
    - name: Ping Google about sitemap update
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        echo "🔔 Notifying search engines about sitemap update..."
        
        # Ping Google
        curl -s "https://www.google.com/ping?sitemap=https://www.defi.garden/sitemap.xml" || echo "Google ping failed"
        
        # Ping Bing
        curl -s "https://www.bing.com/ping?sitemap=https://www.defi.garden/sitemap.xml" || echo "Bing ping failed"

        echo "✅ Search engines notified"

    - name: Ping IndexNow
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        echo "⚡ Submitting changed URLs to IndexNow (Bing + Yandex)..."
        node indexnow-ping.js || echo "IndexNow submission failed"

    - name: Summary
      run: |
        echo "## Sitemap & LLM Files Update Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Total URLs**: $(grep -c '<url>' sitemap.xml)" >> $GITHUB_STEP_SUMMARY
        echo "- **Sitemap Size**: $(du -h sitemap.xml | cut -f1)" >> $GITHUB_STEP_SUMMARY
        if [ -f llms.txt ]; then
          echo "- **LLM Files**: llms.txt ($(du -h llms.txt | cut -f1)), llms-full.txt ($(du -h llms-full.txt | cut -f1))" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- **Last Updated**: $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Completed successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### SEO & AI Benefits" >> $GITHUB_STEP_SUMMARY
        echo "- Individual token yield pages for organic search" >> $GITHUB_STEP_SUMMARY
        echo "- Network-specific landing pages" >> $GITHUB_STEP_SUMMARY
        echo "- Pool type categorization pages" >> $GITHUB_STEP_SUMMARY
        echo "- High-value TVL and APY filter pages" >> $GITHUB_STEP_SUMMARY
        echo "- AI-friendly content discovery via llms.txt" >> $GITHUB_STEP_SUMMARY
        echo "- Enhanced robots.txt with AI crawler permissions" >> $GITHUB_STEP_SUMMARY
        echo "- Daily update frequency for fresh content" >> $GITHUB_STEP_SUMMARY
