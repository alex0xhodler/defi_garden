name: Product Loop
# The loop-of-loops, running on GitHub's machines — no Mac, no cron, no quarantine.
# Schedule: heartbeat + up to 3 build iterations, weekday mornings.
# Manual: Actions tab → Product Loop → "Run workflow" (the zero-terminal trigger).

on:
  schedule:
    - cron: "0 7 * * 1-5"   # 07:00 UTC ≈ 09:00 CEST, weekdays
  workflow_dispatch:

concurrency:
  group: product-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # .claude/ is gitignored, so the verifier subagent must be staged from the kit's tracked copy.
      - name: Stage verifier agent
        run: mkdir -p .claude/agents && cp product-loop-kit/agents/verifier.md .claude/agents/

      - name: Git identity for loop commits
        run: |
          git config user.name "product-loop[bot]"
          git config user.email "product-loop@users.noreply.github.com"

      # LOOP 3 — heartbeat (triage). Thinking/judging tier per standing decision 2026-07-10.
      # If claude-fable-5 is unavailable on this API key, change --model to claude-sonnet-5.
      - name: Heartbeat
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are running unattended in GitHub Actions with full git access.
            Read product-loop-kit/prompts/heartbeat.md and execute it exactly.
            When done, commit the kit-file changes (reports/, signals/, BACKLOG.md, LOG.md)
            with message "chore(loop): heartbeat" and push to main.
          claude_args: "--model claude-fable-5 --max-turns 30"

      # LOOP 2 — build iterations. One item per step = fresh context per item (ralph rule).
      # Sonnet builds, always (standing decision 2026-07-10). Verifier runs as a subagent.
      - name: Build iteration 1
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are one build-loop iteration running unattended in GitHub Actions with full git access.
            First: git pull --rebase origin main.
            Then read product-loop-kit/prompts/build.md and execute it exactly (one READY item only).
            You CAN run npm install and npx playwright install chromium if the test suite needs them.
            After shipping per policy (merge on verifier PASS + tests green): git push origin main.
            If no READY item exists, log "no READY items" to product-loop-kit/LOG.md, push, and exit.
          claude_args: "--model claude-sonnet-5 --max-turns 50"

      - name: Build iteration 2
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are one build-loop iteration running unattended in GitHub Actions with full git access.
            First: git pull --rebase origin main.
            Then read product-loop-kit/prompts/build.md and execute it exactly (one READY item only).
            You CAN run npm install and npx playwright install chromium if the test suite needs them.
            After shipping per policy (merge on verifier PASS + tests green): git push origin main.
            If no READY item exists, log "no READY items" to product-loop-kit/LOG.md, push, and exit.
          claude_args: "--model claude-sonnet-5 --max-turns 50"

      - name: Build iteration 3
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are one build-loop iteration running unattended in GitHub Actions with full git access.
            First: git pull --rebase origin main.
            Then read product-loop-kit/prompts/build.md and execute it exactly (one READY item only).
            You CAN run npm install and npx playwright install chromium if the test suite needs them.
            After shipping per policy (merge on verifier PASS + tests green): git push origin main.
            If no READY item exists, log "no READY items" to product-loop-kit/LOG.md, push, and exit.
          claude_args: "--model claude-sonnet-5 --max-turns 50"
